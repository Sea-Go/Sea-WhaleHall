# WhaleHall 家里云配置示例。
# 两个角色都使用已部署的 CPU 优先 Qwen 1.7B 活动分析 Worker。
# apikey 可直接填入 owner-only user-data/config.yaml，也可保留下面的
# 环境变量引用；不要将真实密钥提交到 Git。
reflection:
  name: "qwen3:1.7b"
  baseurl: "https://model.sea-ridethewindbreakthewaves.xyz/v1/activity/analyze"
  apikey: "${WHALEHALL_ACTIVITY_WORKER_TOKEN}"

agent:
  name: "qwen3:1.7b"
  baseurl: "https://model.sea-ridethewindbreakthewaves.xyz/v1/activity/analyze"
  apikey: "${WHALEHALL_ACTIVITY_WORKER_TOKEN}"

# Sea DataCenter 云同步配置。baseUrl 指向家里云 IPv4 FRP 端口（DataCenter API 代理）；
# sync.enabled 默认关闭，可在设置页开启。
datacenter:
  baseUrl: "http://175.24.130.226:23012"
  sync:
    enabled: false
    intervalMs: 30000
