# Model content is sent through the authenticated DataCenter session. The
# DataCenter origin is fixed in application code; this file contains no model
# credential or endpoint.
reflection:
  name: "qwen3:1.7b"

agent:
  name: "qwen3:1.7b"

# Content encryption is implemented but remains separately opt-in. Enabling it
# also requires a per-domain "content" consent below.
cloudSync:
  enabled: false
  contentEncryptionEnabled: false
  consents:
    activity: "off"
    browser: "off"
    presence: "off"
