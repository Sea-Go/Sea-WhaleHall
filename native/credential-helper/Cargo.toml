[package]
name = "whalehall-credential-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[lib]
name = "whalehall_credential_helper"
path = "src/lib.rs"

[[bin]]
name = "whalehall-credential-helper"
path = "src/main.rs"

[dependencies]
getrandom = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = "1.8"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
keyring-core = "1.0.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.1", default-features = false, features = ["keychain"] }
