[workspace]
members = ["protocol", "core", "server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
active-win-pos-rs = "0.11.0"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
directories = "6.0"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["libc", "std", "NSRunningApplication"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1.49", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
whalehall-local-core = { path = "core" }
whalehall-local-protocol = { path = "protocol" }

[profile.release]
lto = "thin"
strip = true
