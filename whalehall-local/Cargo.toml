[workspace]
members = ["protocol", "core", "server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
active-win-pos-rs = "0.11.0"
aes-gcm = "0.10.3"
async-trait = "0.1"
battery = "0.7.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
directories = "6.0"
display-info = "0.5.9"
getrandom = "0.3.4"
iana-time-zone = "0.1.65"
libc = "0.2"
network-interface = "2.0.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["libc", "std", "NSRunningApplication"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFDate", "CFMachPort", "CFRunLoop"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventTypes"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
security-framework = "3.5.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
sys-locale = "0.3.2"
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1.49", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
whalehall-local-core = { path = "core" }
whalehall-local-protocol = { path = "protocol" }
whoami = { version = "2.1.2", default-features = false, features = ["std"] }
zeroize = "1.8.2"

[profile.release]
lto = "thin"
strip = true
