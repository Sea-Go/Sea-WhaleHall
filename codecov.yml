codecov:
  require_ci_to_pass: true

coverage:
  status:
    project:
      default:
        informational: true
        target: auto
    patch:
      default:
        informational: true
        target: 80%
        threshold: 0%
        if_ci_failed: error

flags:
  bun:
    paths:
      - src/
  rust:
    paths:
      - native/local-host/core/src/
      - native/local-host/protocol/src/
      - native/local-host/server/src/

ignore:
  - tests/
  - scripts/
  - dist/
  - build/
  - artifacts/
  - coverage/
  - native/**/target/

github_checks:
  annotations: true

comment:
  layout: "reach, diff, flags, files"
  require_changes: true
