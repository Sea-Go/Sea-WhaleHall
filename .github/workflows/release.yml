name: Stable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version without the v prefix (x.y.z)
        required: true
        type: string
      minimum_supported_version:
        description: Oldest client version allowed to continue without a mandatory update
        required: true
        type: string
      release_notes:
        description: Chinese release notes shown in the client and on GitHub
        required: true
        type: string
      release_scope:
        description: Stable platforms to publish
        required: true
        default: macos-and-windows
        type: choice
        options:
          - macos-only
          - macos-and-windows

concurrency:
  group: whalehall-stable-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  RUST_TOOLCHAIN: 1.97.1

jobs:
  prepare:
    name: Validate immutable release inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: stable-release
    outputs:
      version: ${{ steps.release.outputs.version }}
      minimum_supported_version: ${{ steps.release.outputs.minimum_supported_version }}
      published_at: ${{ steps.release.outputs.published_at }}
      previous_tag: ${{ steps.release.outputs.previous_tag }}
      public_key_fingerprint: ${{ steps.release.outputs.public_key_fingerprint }}
      release_scope: ${{ steps.release.outputs.release_scope }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      MINIMUM_SUPPORTED_VERSION: ${{ inputs.minimum_supported_version }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      RELEASE_SCOPE: ${{ inputs.release_scope }}
      WHALEHALL_APP_UPDATE_PUBLIC_KEY_SPKI_BASE64: ${{ secrets.WHALEHALL_APP_UPDATE_PUBLIC_KEY_SPKI_BASE64 }}
    steps:
      - name: Require the canonical repository and protected branch
        env:
          CURRENT_REPOSITORY: ${{ github.repository }}
          CURRENT_REF: ${{ github.ref }}
        run: |
          if [[ "$CURRENT_REPOSITORY" != "Sea-Go/Sea-WhaleHall" ]]; then
            echo "::error::Stable releases may only run in Sea-Go/Sea-WhaleHall."
            exit 1
          fi
          if [[ "$CURRENT_REF" != "refs/heads/main" ]]; then
            echo "::error::Stable releases may only run from the protected main branch."
            exit 1
          fi

      - name: Checkout the exact release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Validate version, floor, notes, and prior Stable release
        id: release
        run: |
          set -euo pipefail

          release_notes_file="$RUNNER_TEMP/release-notes.md"
          printf '%s' "$RELEASE_NOTES" > "$release_notes_file"

          case "$RELEASE_SCOPE" in
            macos-only|macos-and-windows) ;;
            *)
              echo "::error::Stable release scope must be macos-only or macos-and-windows."
              exit 1
              ;;
          esac

          tag="v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Stable releases are immutable."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists. Stable tags cannot be reused."
            exit 1
          fi

          previous_tag=$(
            gh release list --limit 1000 --json tagName,isDraft,isPrerelease \
              --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' |
              awk '/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/' |
              sort -V |
              tail -n 1
          )
          validation=(
            bun run scripts/app-update-validate-release.ts
            --version "$RELEASE_VERSION"
            --minimum-supported-version "$MINIMUM_SUPPORTED_VERSION"
            --release-notes-file "$release_notes_file"
            --release-scope "$RELEASE_SCOPE"
          )
          if [[ -n "$previous_tag" ]]; then
            if [[ ! "$previous_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::The latest GitHub release does not use a stable vX.Y.Z tag: $previous_tag"
              exit 1
            fi
            previous_directory="$RUNNER_TEMP/previous-release"
            previous_assets_file="$RUNNER_TEMP/previous-release-assets.txt"
            mkdir -p "$previous_directory"
            gh release view "$previous_tag" --json assets --jq '.assets[].name' > "$previous_assets_file"
            gh release download "$previous_tag" \
              --pattern 'stable-macos-arm64-manifest.*' \
              --dir "$previous_directory"
            validation+=(
              --previous-manifest "$previous_directory/stable-macos-arm64-manifest.json"
              --previous-manifest-signature "$previous_directory/stable-macos-arm64-manifest.sig"
              --previous-version "${previous_tag#v}"
              --previous-release-assets-file "$previous_assets_file"
            )
          fi
          "${validation[@]}"

          public_key_fingerprint=$(python3 - <<'PY'
          import base64
          import hashlib
          import os

          encoded = os.environ.get("WHALEHALL_APP_UPDATE_PUBLIC_KEY_SPKI_BASE64", "").strip()
          decoded = base64.b64decode(encoded, validate=True)
          if base64.b64encode(decoded).decode("ascii") != encoded:
              raise SystemExit("The Stable update public key must use canonical base64.")
          print(hashlib.sha256(decoded).hexdigest())
          PY
          )
          previous_tag_output=${previous_tag:-none}

          published_at=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')
          {
            echo "version=$RELEASE_VERSION"
            echo "minimum_supported_version=$MINIMUM_SUPPORTED_VERSION"
            echo "published_at=$published_at"
            echo "previous_tag=$previous_tag_output"
            echo "public_key_fingerprint=$public_key_fingerprint"
            echo "release_scope=$RELEASE_SCOPE"
          } >> "$GITHUB_OUTPUT"

      - name: Upload validated release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-release-metadata
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 1

  quality:
    name: Re-run complete candidate checks
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      WHALEHALL_CI_DISPLAY_MODE: degraded
      WHALEHALL_CI_FOREGROUND_MODE: degraded
      WHALEHALL_CI_PRESENCE_MODE: degraded
    steps:
      - name: Checkout the exact release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install "$RUST_TOOLCHAIN" --component clippy --component rustfmt
          rustup default "$RUST_TOOLCHAIN"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: whalehall-local -> target
          cache-on-failure: true
          key: stable-release-quality

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run complete checks
        run: bun run check

  datacenter:
    name: Require exact DataCenter candidate integration
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      WHALEHALL_CANDIDATE_SHA: ${{ github.sha }}
      DATACENTER_GITLAB_PROJECT_ID: ${{ vars.DATACENTER_GITLAB_PROJECT_ID }}
      DATACENTER_GITLAB_REF: ${{ vars.DATACENTER_GITLAB_REF }}
      DATACENTER_GITLAB_TRIGGER_TOKEN: ${{ secrets.DATACENTER_GITLAB_TRIGGER_TOKEN }}
      DATACENTER_GITLAB_API_TOKEN: ${{ secrets.DATACENTER_GITLAB_API_TOKEN }}
    steps:
      - name: Checkout protected integration trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Trigger and require DataCenter integration
        run: scripts/ci/trigger-datacenter-integration.sh

  macos:
    name: Signed and notarized macOS arm64
    needs: [prepare, quality, datacenter]
    runs-on: macos-15
    timeout-minutes: 65
    environment: stable-release
    env:
      WHALEHALL_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      WHALEHALL_APP_UPDATE_PUBLIC_KEY_SPKI_BASE64: ${{ secrets.WHALEHALL_APP_UPDATE_PUBLIC_KEY_SPKI_BASE64 }}
      ELECTROBUN_DEVELOPER_ID: ${{ secrets.WHALEHALL_MACOS_DEVELOPER_ID }}
      WHALEHALL_APPLE_TEAM_ID: ${{ secrets.WHALEHALL_MACOS_APPLE_TEAM_ID }}
      WHALEHALL_MACOS_NOTARIZE: "true"
      WHALEHALL_RELEASE_SIGNING_REQUIRED: "true"
      ELECTROBUN_APPLEAPIISSUER: ${{ secrets.WHALEHALL_MACOS_NOTARY_ISSUER_ID }}
      ELECTROBUN_APPLEAPIKEY: ${{ secrets.WHALEHALL_MACOS_NOTARY_KEY_ID }}
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.WHALEHALL_MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.WHALEHALL_MACOS_CERTIFICATE_PASSWORD }}
      MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.WHALEHALL_MACOS_NOTARY_KEY_P8_BASE64 }}
    steps:
      - name: Require an arm64 runner
        run: |
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "::error::The macOS Stable artifact must be built natively on arm64."
            exit 1
          fi

      - name: Checkout the exact release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install "$RUST_TOOLCHAIN"
          rustup default "$RUST_TOOLCHAIN"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: whalehall-local -> target
          cache-on-failure: true
          key: stable-release-macos-arm64

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Exercise the app-owned macOS atomic update and rollback
        env:
          WHALEHALL_REQUIRE_MACOS_UPDATE_INTEGRATION: "1"
        run: bun test tests/app-update-macos-installer.integration.test.ts

      - name: Pin the Stable update verification key
        env:
          EXPECTED_PUBLIC_KEY_FINGERPRINT: ${{ needs.prepare.outputs.public_key_fingerprint }}
        run: |
          actual=$(python3 - <<'PY'
          import base64
          import hashlib
          import os

          encoded = os.environ.get("WHALEHALL_APP_UPDATE_PUBLIC_KEY_SPKI_BASE64", "").strip()
          decoded = base64.b64decode(encoded, validate=True)
          print(hashlib.sha256(decoded).hexdigest())
          PY
          )
          if [[ "$actual" != "$EXPECTED_PUBLIC_KEY_FINGERPRINT" ]]; then
            echo "::error::The Stable update verification key changed after release preparation."
            exit 1
          fi

      - name: Install ephemeral Developer ID and notarization credentials
        run: |
          certificate_path="$RUNNER_TEMP/whalehall-release.p12"
          notary_key_path="$RUNNER_TEMP/AuthKey_$ELECTROBUN_APPLEAPIKEY.p8"
          keychain_path="$RUNNER_TEMP/login.keychain-db"
          keychain_password=$(uuidgen)
          export CERTIFICATE_PATH="$certificate_path"
          export NOTARY_KEY_PATH="$notary_key_path"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["CERTIFICATE_PATH"]).write_bytes(
              base64.b64decode(os.environ["MACOS_CERTIFICATE_P12_BASE64"], validate=True)
          )
          Path(os.environ["NOTARY_KEY_PATH"]).write_bytes(
              base64.b64decode(os.environ["MACOS_NOTARY_KEY_P8_BASE64"], validate=True)
          )
          PY
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          chmod 600 "$certificate_path" "$notary_key_path" "$keychain_path"
          echo "WHALEHALL_RELEASE_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          echo "ELECTROBUN_APPLEAPIKEYPATH=$notary_key_path" >> "$GITHUB_ENV"

      - name: Build fail-closed Stable package
        run: bun run build:stable

      - name: Require exactly the macOS full archive, DMG, and updater metadata
        run: |
          expected=(
            stable-macos-arm64-update.json
            stable-macos-arm64-WhaleHall.app.tar.zst
            stable-macos-arm64-WhaleHall.dmg
          )
          actual_count=$(find artifacts -maxdepth 1 -type f | wc -l | tr -d ' ')
          if [[ "$actual_count" != "${#expected[@]}" ]]; then
            echo "::error::Unexpected macOS Stable artifact count: $actual_count"
            find artifacts -maxdepth 1 -type f -print
            exit 1
          fi
          for filename in "${expected[@]}"; do
            test -s "artifacts/$filename"
          done
          if find artifacts -maxdepth 1 -name '*.patch' -print -quit | grep -q .; then
            echo "::error::Stable releases must not contain delta patches."
            exit 1
          fi

      - name: Upload immutable macOS release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-macos-arm64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 1

      - name: Remove ephemeral Apple credentials
        if: ${{ always() }}
        run: |
          if [[ -n "${WHALEHALL_RELEASE_KEYCHAIN:-}" ]]; then
            security delete-keychain "$WHALEHALL_RELEASE_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/whalehall-release.p12" "$RUNNER_TEMP"/AuthKey_*.p8

  windows:
    name: Authenticode-signed Windows x64
    needs: [prepare, quality, datacenter]
    if: ${{ needs.prepare.outputs.release_scope == 'macos-and-windows' }}
    runs-on: windows-2025
    timeout-minutes: 55
    environment: stable-release
    env:
      WHALEHALL_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      WHALEHALL_APP_UPDATE_PUBLIC_KEY_SPKI_BASE64: ${{ secrets.WHALEHALL_APP_UPDATE_PUBLIC_KEY_SPKI_BASE64 }}
      WHALEHALL_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WHALEHALL_WINDOWS_CERTIFICATE_PASSWORD }}
      WHALEHALL_WINDOWS_CERTIFICATE_SHA1: ${{ secrets.WHALEHALL_WINDOWS_CERTIFICATE_SHA1 }}
      WHALEHALL_WINDOWS_PUBLISHER: ${{ secrets.WHALEHALL_WINDOWS_PUBLISHER }}
      WHALEHALL_WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WHALEHALL_WINDOWS_CERTIFICATE_PFX_BASE64 }}
    steps:
      - name: Require an x64 runner
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne "AMD64") {
            throw "The Windows Stable artifact must be built natively on x64."
          }

      - name: Checkout the exact release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install "$RUST_TOOLCHAIN"
          rustup default "$RUST_TOOLCHAIN"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: whalehall-local -> target
          cache-on-failure: true
          key: stable-release-windows-x64

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Prove whalehall-local Windows process-tree ownership
        shell: pwsh
        run: |
          $output = & cargo test --locked --manifest-path whalehall-local/Cargo.toml `
            -p whalehall-local-server --test windows_process_tree -- `
            --nocapture --test-threads=1 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            throw "The Windows process-tree integration test failed with exit code $exitCode."
          }
          $summary = $output -join "`n"
          if ($summary -notmatch '2 passed; 0 failed; 0 ignored') {
            throw "The Windows process-tree integration test did not execute exactly two passing tests."
          }

      - name: Exercise the app-owned Windows update handoff and rollback
        shell: pwsh
        env:
          WHALEHALL_REQUIRE_WINDOWS_UPDATE_INTEGRATION: "1"
        run: bun test tests/app-update-windows-installer.integration.test.ts

      - name: Pin the Stable update verification key
        shell: pwsh
        env:
          EXPECTED_PUBLIC_KEY_FINGERPRINT: ${{ needs.prepare.outputs.public_key_fingerprint }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WHALEHALL_APP_UPDATE_PUBLIC_KEY_SPKI_BASE64.Trim())
          $actual = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_PUBLIC_KEY_FINGERPRINT) {
            throw "The Stable update verification key changed after release preparation."
          }

      - name: Stage Authenticode certificate and locate SignTool
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "whalehall-release.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WHALEHALL_WINDOWS_CERTIFICATE_PFX_BASE64)
          )
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) {
            throw "A Windows SDK x64 SignTool installation is required."
          }
          "WHALEHALL_WINDOWS_CERTIFICATE_PATH=$certificatePath" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WHALEHALL_WINDOWS_SIGNTOOL_PATH=$signTool" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build fail-closed Stable package
        run: bun run build:stable

      - name: Require exactly the Windows full archive, installer, and updater metadata
        shell: pwsh
        run: |
          $expected = @(
            "stable-win-x64-update.json",
            "stable-win-x64-WhaleHall.tar.zst",
            "stable-win-x64-WhaleHall-Setup.zip"
          )
          $actual = @(Get-ChildItem artifacts -File | Select-Object -ExpandProperty Name)
          if ($actual.Count -ne $expected.Count) {
            throw "Unexpected Windows Stable artifact count: $($actual.Count)"
          }
          foreach ($filename in $expected) {
            $path = Join-Path "artifacts" $filename
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing Windows Stable artifact: $filename"
            }
            if ((Get-Item -LiteralPath $path).Length -le 0) {
              throw "Empty Windows Stable artifact: $filename"
            }
          }
          if (Get-ChildItem artifacts -Filter *.patch -File) {
            throw "Stable releases must not contain delta patches."
          }

      - name: Upload immutable Windows release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-win-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 1

      - name: Remove ephemeral Windows certificate
        if: ${{ always() }}
        shell: pwsh
        run: Remove-Item -LiteralPath "$env:RUNNER_TEMP\whalehall-release.pfx" -Force -ErrorAction SilentlyContinue

  publish:
    name: Verify draft assets and atomically publish Stable
    needs: [prepare, quality, datacenter, macos, windows]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.prepare.result == 'success' &&
        needs.quality.result == 'success' &&
        needs.datacenter.result == 'success' &&
        needs.macos.result == 'success' &&
        (
          (needs.prepare.outputs.release_scope == 'macos-only' && needs.windows.result == 'skipped') ||
          (needs.prepare.outputs.release_scope == 'macos-and-windows' && needs.windows.result == 'success')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: stable-release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      MINIMUM_SUPPORTED_VERSION: ${{ needs.prepare.outputs.minimum_supported_version }}
      PUBLISHED_AT: ${{ needs.prepare.outputs.published_at }}
      EXPECTED_PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
      RELEASE_SCOPE: ${{ needs.prepare.outputs.release_scope }}
      WHALEHALL_APP_UPDATE_PRIVATE_KEY_PKCS8_BASE64: ${{ secrets.WHALEHALL_APP_UPDATE_PRIVATE_KEY_PKCS8_BASE64 }}
      WHALEHALL_APP_UPDATE_PUBLIC_KEY_SPKI_BASE64: ${{ secrets.WHALEHALL_APP_UPDATE_PUBLIC_KEY_SPKI_BASE64 }}
    steps:
      - name: Checkout the exact release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Pin the Stable update verification key
        env:
          EXPECTED_PUBLIC_KEY_FINGERPRINT: ${{ needs.prepare.outputs.public_key_fingerprint }}
        run: |
          actual=$(python3 - <<'PY'
          import base64
          import hashlib
          import os

          encoded = os.environ.get("WHALEHALL_APP_UPDATE_PUBLIC_KEY_SPKI_BASE64", "").strip()
          decoded = base64.b64decode(encoded, validate=True)
          print(hashlib.sha256(decoded).hexdigest())
          PY
          )
          if [[ "$actual" != "$EXPECTED_PUBLIC_KEY_FINGERPRINT" ]]; then
            echo "::error::The Stable update verification key changed after release preparation."
            exit 1
          fi

      - name: Download macOS release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stable-macos-arm64
          path: release-assets

      - name: Download Windows release inputs
        if: ${{ needs.prepare.outputs.release_scope == 'macos-and-windows' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stable-win-x64
          path: release-assets

      - name: Download validated release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stable-release-metadata
          path: release-metadata

      - name: Generate and verify signed platform manifests
        run: |
          targets=(macos:arm64)
          if [[ "$RELEASE_SCOPE" == "macos-and-windows" ]]; then
            targets+=(win:x64)
          fi
          for target in "${targets[@]}"; do
            platform=${target%%:*}
            arch=${target##*:}
            bun run scripts/app-update-manifest.ts \
              --artifact-directory release-assets \
              --platform "$platform" \
              --arch "$arch" \
              --version "$RELEASE_VERSION" \
              --minimum-supported-version "$MINIMUM_SUPPORTED_VERSION" \
              --published-at "$PUBLISHED_AT" \
              --release-notes-file release-metadata/release-notes.md
          done
          bun run scripts/app-update-verify-release.ts \
            --artifact-directory release-assets \
            --version "$RELEASE_VERSION" \
            --release-scope "$RELEASE_SCOPE"

      - name: Upload every asset to a draft, re-download, and publish
        run: |
          set -euo pipefail

          tag="v$RELEASE_VERSION"
          assert_stable_baseline() {
            current_previous_tag=$(
              gh release list --limit 1000 --json tagName,isDraft,isPrerelease \
                --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' |
                awk '/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/' |
                sort -V |
                tail -n 1
            )
            current_previous_tag=${current_previous_tag:-none}
            if [[ "$current_previous_tag" != "$EXPECTED_PREVIOUS_TAG" ]]; then
              echo "::error::The highest Stable release changed after preparation."
              exit 1
            fi

            validation=(
              bun run scripts/app-update-validate-release.ts
              --version "$RELEASE_VERSION"
              --minimum-supported-version "$MINIMUM_SUPPORTED_VERSION"
              --release-notes-file release-metadata/release-notes.md
              --release-scope "$RELEASE_SCOPE"
            )
            if [[ "$current_previous_tag" != "none" ]]; then
              previous_directory="$RUNNER_TEMP/publish-previous-release"
              previous_assets_file="$RUNNER_TEMP/publish-previous-release-assets.txt"
              rm -rf "$previous_directory"
              mkdir -p "$previous_directory"
              gh release view "$current_previous_tag" --json assets --jq '.assets[].name' > "$previous_assets_file"
              gh release download "$current_previous_tag" \
                --pattern 'stable-macos-arm64-manifest.*' \
                --dir "$previous_directory"
              validation+=(
                --previous-manifest "$previous_directory/stable-macos-arm64-manifest.json"
                --previous-manifest-signature "$previous_directory/stable-macos-arm64-manifest.sig"
                --previous-version "${current_previous_tag#v}"
                --previous-release-assets-file "$previous_assets_file"
              )
            fi
            "${validation[@]}"
          }

          assert_stable_baseline
          release_created=false
          cleanup_failed_draft() {
            if [[ "$release_created" == "true" ]]; then
              gh release delete "$tag" --cleanup-tag --yes || true
            fi
          }
          trap cleanup_failed_draft EXIT HUP INT TERM

          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "WhaleHall $tag" \
            --notes-file release-metadata/release-notes.md \
            --draft
          release_created=true
          gh release upload "$tag" release-assets/*

          verification_directory="$RUNNER_TEMP/published-assets"
          mkdir -p "$verification_directory"
          gh release download "$tag" --dir "$verification_directory"
          bun run scripts/app-update-verify-release.ts \
            --artifact-directory "$verification_directory" \
            --version "$RELEASE_VERSION" \
            --release-scope "$RELEASE_SCOPE"

          assert_stable_baseline
          gh release edit "$tag" --draft=false --latest
          release_created=false
          trap - EXIT HUP INT TERM
