name: Security

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "20 3 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Gitleaks CLI
        run: |
          gitleaks_bin="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$gitleaks_bin"
          GOBIN="$gitleaks_bin" go install github.com/zricethezav/gitleaks/v8@v8.30.0
          echo "$gitleaks_bin" >> "$GITHUB_PATH"

      - name: Scan committed secrets
        run: gitleaks git --redact --log-opts='--all' .

  workflow-security:
    name: Workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          inputs: .github
          collect: workflows
          version: "1.29.0"
          online-audits: "false"
          min-severity: low
          min-confidence: high
          advanced-security: "false"
          annotations: "true"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review introduced dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime,development
          base-ref: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha }}

  security-gate:
    name: Security gate
    needs: [gitleaks, workflow-security, dependency-review]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require security checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          WORKFLOW_SECURITY_RESULT: ${{ needs.workflow-security.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          for result in "$GITLEAKS_RESULT" "$WORKFLOW_SECURITY_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::A required security check finished with result: $result"
              exit 1
            fi
          done

          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "merge_group" ]]; then
            if [[ "$DEPENDENCY_REVIEW_RESULT" != "success" ]]; then
              echo "::error::Dependency review finished with result: $DEPENDENCY_REVIEW_RESULT"
              exit 1
            fi
          fi
