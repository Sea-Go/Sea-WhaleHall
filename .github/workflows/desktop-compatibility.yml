name: Desktop compatibility

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

concurrency:
  group: desktop-compatibility-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: 1.97.1
  BUN_VERSION: 1.3.14

permissions:
  contents: read

jobs:
  configuration:
    name: Desktop runner configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report desktop runner availability
        env:
          ENABLED: ${{ vars.WHALEHALL_ENABLE_DESKTOP_RUNNERS }}
        run: |
          if [[ "$ENABLED" == "true" ]]; then
            echo "Interactive desktop runner matrix is enabled."
          else
            echo "::notice::Interactive desktop runners are not provisioned. Set WHALEHALL_ENABLE_DESKTOP_RUNNERS=true only after every documented runner label is online."
          fi

  desktop-sensors:
    name: Real desktop sensor · ${{ matrix.name }}
    needs: configuration
    if: vars.WHALEHALL_ENABLE_DESKTOP_RUNNERS == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-10-ltsc-x64
            runner_label: whalehall-windows-10-ltsc-x64
          - name: windows-11-x64
            runner_label: whalehall-windows-11-x64
          - name: ubuntu-gnome-wayland-x64
            runner_label: whalehall-ubuntu-gnome-wayland-x64
          - name: fedora-gnome-wayland-x64
            runner_label: whalehall-fedora-gnome-wayland-x64
          - name: arch-kde-wayland-x64
            runner_label: whalehall-arch-kde-wayland-x64
          - name: debian-xfce-x11-x64
            runner_label: whalehall-debian-xfce-x11-x64
          - name: macos-14-x64
            runner_label: whalehall-macos-14-x64
          - name: macos-15-arm64
            runner_label: whalehall-macos-15-arm64
    runs-on:
      - self-hosted
      - interactive-desktop
      - ${{ matrix.runner_label }}
    env:
      WHALEHALL_CI_DISPLAY_MODE: required
      WHALEHALL_CI_FOREGROUND_MODE: required
      WHALEHALL_CI_PRESENCE_MODE: complete

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Select provisioned Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install "$RUST_TOOLCHAIN"
          rustup default "$RUST_TOOLCHAIN"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test Rust workspace on the real desktop
        run: bun run test:rust

      - name: Probe every sensor with a real display and foreground window
        run: bun run test:sensors:ci
