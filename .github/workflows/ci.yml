name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

permissions:
  contents: read

jobs:
  check-and-build:
    name: Verify and package · ${{ matrix.name }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
          - name: windows-x64
            os: windows-latest
          - name: linux-x64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component clippy --component rustfmt
          rustup default 1.97.1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: whalehall-local -> target
          cache-on-failure: true

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libdbus-1-dev libxcb1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Verify Rust activity sensor and Local Tools
        run: bun run check:rust

      - name: Test TypeScript and real JSONL process integration
        run: bun test

      - name: Build Electrobun canary
        run: bun run build:canary

      - name: Upload unsigned build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: whalehall-${{ matrix.name }}
          path: artifacts/**
          if-no-files-found: error
          retention-days: 7
