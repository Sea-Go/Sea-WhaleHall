name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: 1.97.1
  BUN_VERSION: 1.3.14

permissions:
  contents: read

jobs:
  quality:
    name: Quality and complete test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WHALEHALL_CI_DISPLAY_MODE: degraded
      WHALEHALL_CI_FOREGROUND_MODE: degraded

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Lint workflow definitions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate CI support scripts
        run: bash -n scripts/ci/*.sh

      - name: Install Linux sensor dependencies
        run: scripts/ci/install-linux-dependencies.sh debian sensor

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install "$RUST_TOOLCHAIN" --component clippy --component rustfmt
          rustup default "$RUST_TOOLCHAIN"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: whalehall-local -> target
          cache-on-failure: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run complete checks
        run: bun run check

  hosted-sensors:
    name: Hosted sensor · ${{ matrix.name }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04
            os: ubuntu-22.04
            display_mode: degraded
            foreground_mode: degraded
          - name: ubuntu-24.04
            os: ubuntu-24.04
            display_mode: degraded
            foreground_mode: degraded
          - name: windows-server-2022
            os: windows-2022
            display_mode: required
            foreground_mode: required
          - name: windows-server-2025
            os: windows-2025
            display_mode: required
            foreground_mode: required
          - name: macos-14
            os: macos-14
            display_mode: required
            foreground_mode: required
          - name: macos-15
            os: macos-15
            display_mode: required
            foreground_mode: required
    runs-on: ${{ matrix.os }}
    env:
      WHALEHALL_CI_DISPLAY_MODE: ${{ matrix.display_mode }}
      WHALEHALL_CI_FOREGROUND_MODE: ${{ matrix.foreground_mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux sensor dependencies
        if: runner.os == 'Linux'
        run: scripts/ci/install-linux-dependencies.sh debian sensor

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install "$RUST_TOOLCHAIN"
          rustup default "$RUST_TOOLCHAIN"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: whalehall-local -> target
          cache-on-failure: true
          key: hosted-${{ matrix.name }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test Rust workspace
        run: bun run test:rust

      - name: Open a deterministic Windows foreground application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $probe = Start-Process notepad.exe -PassThru
          Start-Sleep -Seconds 2
          $activated = (New-Object -ComObject WScript.Shell).AppActivate($probe.Id)
          if (-not $activated) {
            throw "Unable to activate the Notepad sensor probe window."
          }

      - name: Open a deterministic macOS foreground application
        if: runner.os == 'macOS'
        run: |
          open -a TextEdit
          osascript -e 'tell application "TextEdit" to activate'
          sleep 2

      - name: Probe every sensor through the native process
        run: bun run test:sensors:ci

  linux-distros:
    name: Linux distro sensor · ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04
            image: ubuntu:22.04
            family: debian
          - name: ubuntu-24.04
            image: ubuntu:24.04
            family: debian
          - name: debian-12
            image: debian:12
            family: debian
          - name: debian-13
            image: debian:13
            family: debian
          - name: fedora-43
            image: fedora:43
            family: fedora
          - name: fedora-44
            image: fedora:44
            family: fedora
          - name: arch-rolling
            image: archlinux:base
            family: arch
          - name: rocky-9
            image: rockylinux:9
            family: rhel
          - name: alma-9
            image: almalinux:9
            family: rhel
          - name: centos-stream-9
            image: quay.io/centos/centos:stream9
            family: rhel
          - name: centos-stream-10
            image: quay.io/centos/centos:stream10
            family: rhel
          - name: opensuse-leap-16.0
            image: opensuse/leap:16.0
            family: suse
    container:
      image: ${{ matrix.image }}
    env:
      AR: /usr/bin/ar
      CC: /usr/bin/gcc
      CXX: /usr/bin/g++
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: /usr/bin/gcc
      LANG: C.UTF-8
      PATH: /github/home/.bun/bin:/github/home/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PKG_CONFIG: ${{ matrix.family == 'suse' && '/usr/bin/pkgconf' || '/usr/bin/pkg-config' }}
      WHALEHALL_CI_DISPLAY_MODE: degraded
      WHALEHALL_CI_FOREGROUND_MODE: degraded

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install distribution dependencies
        run: scripts/ci/install-linux-dependencies.sh "${{ matrix.family }}" sensor

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Rust toolchain
        run: |
          if [[ -x /usr/bin/curl ]]; then
            /usr/bin/curl --proto '=https' --tlsv1.2 -fsSL \
              https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init \
              -o /tmp/rustup-init
          else
            /usr/bin/wget --https-only --quiet \
              --output-document=/tmp/rustup-init \
              https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init
          fi
          /usr/bin/chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test Rust workspace
        run: cargo test --locked --manifest-path whalehall-local/Cargo.toml --workspace

      - name: Probe every sensor in the distribution
        run: bun run test:sensors:ci

  virtual-x11:
    name: Linux virtual desktop · X11/Openbox
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DISPLAY: :99
      WHALEHALL_CI_DISPLAY_MODE: required
      WHALEHALL_CI_FOREGROUND_MODE: required

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install X11 sensor dependencies
        run: scripts/ci/install-linux-dependencies.sh debian x11

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install "$RUST_TOOLCHAIN"
          rustup default "$RUST_TOOLCHAIN"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: whalehall-local -> target
          cache-on-failure: true
          key: virtual-x11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test Rust workspace
        run: bun run test:rust

      - name: Start a deterministic X11 desktop
        run: scripts/ci/start-x11-desktop.sh

      - name: Probe screen resolution and foreground usage
        run: bun run test:sensors:ci

  package:
    name: Package · ${{ matrix.name }}
    needs: [quality, hosted-sensors, linux-distros, virtual-x11]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-15
            os: macos-15
          - name: windows-2025
            os: windows-2025
          - name: ubuntu-24.04
            os: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: scripts/ci/install-linux-dependencies.sh debian desktop

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install "$RUST_TOOLCHAIN"
          rustup default "$RUST_TOOLCHAIN"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: whalehall-local -> target
          cache-on-failure: true
          key: package-${{ matrix.name }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Electrobun canary
        run: bun run build:canary

      - name: Upload unsigned build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: whalehall-${{ matrix.name }}
          path: artifacts/**
          if-no-files-found: error
          retention-days: 7
