name: Coverage

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: 1.97.1
  BUN_VERSION: 1.3.14

permissions:
  contents: read
  id-token: write

jobs:
  reports:
    name: Coverage reports
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      WHALEHALL_CI_DISPLAY_MODE: degraded
      WHALEHALL_CI_FOREGROUND_MODE: degraded
      WHALEHALL_CI_PRESENCE_MODE: degraded

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Install Linux sensor dependencies
        run: scripts/ci/install-linux-dependencies.sh debian sensor

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install "$RUST_TOOLCHAIN" --component llvm-tools-preview
          rustup default "$RUST_TOOLCHAIN"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: whalehall-local -> target
          cache-on-failure: true
          key: coverage

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create coverage directories
        run: mkdir -p coverage/bun coverage/rust

      - name: Generate Bun coverage
        run: bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage/bun

      - name: Install Rust coverage tool
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked

      - name: Generate Rust coverage
        run: cargo llvm-cov --locked --manifest-path whalehall-local/Cargo.toml --workspace --lcov --output-path coverage/rust/lcov.info

      - name: Upload coverage reports
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: whalehall-coverage
          path: coverage/**/*.info
          if-no-files-found: error
          retention-days: 14

      - name: Upload Bun coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage/bun/lcov.info
          flags: bun
          name: whalehall-bun
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage/rust/lcov.info
          flags: rust
          name: whalehall-rust
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false
