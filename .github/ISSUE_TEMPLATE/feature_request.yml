name: "✨ Feature request | 功能建议"
description: Propose a feature or suggestion | 提出功能需求或建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem and desired outcome, not only an implementation.
        Do not include credentials or real activity, browser, calendar, or accessibility data.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity | 要解决的问题
      description: Who is affected, and what is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed solution | 期望的解决方案
      description: State the intended behavior and user value.
    validations:
      required: true
  - type: dropdown
    id: boundaries
    attributes:
      label: Potentially affected boundaries | 可能涉及的区域
      multiple: true
      options:
        - React client
        - Desktop pet
        - Electrobun main process or Typed RPC
        - Agent or model integration
        - Rust Local Tool or protocol
        - Sensor, permissions, or local persistence
        - Build, packaging, or CI
        - Documentation
        - Unknown or needs design
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered | 考虑过的替代方案
      description: Optional. Include alternatives, dependencies, or related issues.
  - type: textarea
    id: context
    attributes:
      label: Additional context | 补充说明
      description: Add links, a sanitized sketch, screenshots, or other useful context.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks | 提交前确认
      options:
        - label: I searched for an existing issue or proposal.
          required: true
        - label: I did not include secrets or real sensitive local data.
          required: true
