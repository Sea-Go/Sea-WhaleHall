name: Engineering task
description: Request a focused refactor, test, documentation, build, CI, or maintenance change.
title: "[Task]: "
labels: []
body:
  - type: dropdown
    id: kind
    attributes:
      label: Task type
      options:
        - Refactor or technical debt
        - Tests or quality
        - Build, packaging, or CI
        - Dependency or security maintenance
        - Documentation
        - Investigation or research
        - Other
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What concrete engineering or user outcome does this work support?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      placeholder: |
        Included:
        Out of scope:
        Affected boundaries:
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and validation
      description: Define observable completion and the expected checks or evidence.
      placeholder: |
        - [ ] ...
        Validation:
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risks, privacy impact, and rollback
      description: State "none expected" only after considering data, permissions, compatibility, and lifecycle impact.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and related work
      description: Link related issues, specifications, decisions, or external blockers.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched for a duplicate and kept the task to one outcome.
          required: true
        - label: I did not include credentials or real sensitive local data.
          required: true
