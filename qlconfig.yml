# CodeQL 查询过滤：显式登记与本仓设计相关的豁免，不静默吞掉未知告警。
# 调整本文件须经 review——每条 exclude 必须附带可核查的理由。
query-filter:
  - exclude:
      id: js/path-injection
    reason: >-
      命中的是开发期 e2e 触发契约：src/bun/index.ts 按 $HOME 拼接
      pet-e2e-submit.json / planning-e2e-submit.json 两个触发文件，
      且仅在显式 WHALEHALL_PLANNING_E2E_TRIGGER /
      WHALEHALL_PET_E2E_TRIGGER 环境变量门控下激活，
      只读消费后即删除；非产品攻击面，不随打包分发。
      告警明细见 PR #91 的 CodeQL 检查。
