# WhaleHall only loads two cloud model roles. Both intentionally use the
# CPU-first Qwen activity Worker on the home cloud. Keep this user-data file
# owner-only when replacing the environment reference with a literal API key.
reflection:
  name: "qwen3:1.7b"
  baseurl: "https://model.sea-ridethewindbreakthewaves.xyz/v1/activity/analyze"
  apikey: "${WHALEHALL_ACTIVITY_WORKER_TOKEN}"

agent:
  name: "qwen3:1.7b"
  baseurl: "https://model.sea-ridethewindbreakthewaves.xyz/v1/activity/analyze"
  apikey: "${WHALEHALL_ACTIVITY_WORKER_TOKEN}"

# Sea DataCenter cloud sync. baseUrl points at the home-cloud IPv4 FRP port
# that proxies the DataCenter API; sync.enabled is turned on from Settings.
datacenter:
  baseUrl: "http://175.24.130.226:23012"
  sync:
    enabled: false
    intervalMs: 30000
