# Model content is sent through the authenticated DataCenter session. The
# DataCenter origin is fixed in application code; this file contains no model
# credential or endpoint.
reflection:
  name: "reflection"

planning:
  name: "planning"

agent:
  name: "agent"

# Cloud synchronization is opt-in. Content uses a DataCenter-issued X25519
# context and client-envelope.v1 only when this flag and the domain consent are
# both enabled; the checked-in default keeps every cloud path disabled.
cloudSync:
  enabled: false
  contentEncryptionEnabled: false
  consents:
    activity: "off"
    browser: "off"
    presence: "off"
